services:
  postgres:
    image: postgres:18.4-alpine
    container_name: solvia-postgres
    environment:
      POSTGRES_DB: solvia
      POSTGRES_USER: solvia
      POSTGRES_PASSWORD: solvia-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - solvia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvia -d solvia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  solvia-postgres-data:
