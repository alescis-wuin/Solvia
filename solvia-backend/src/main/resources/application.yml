server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: solvia-backend
  datasource:
    url: ${SOLVIA_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/solvia}
    username: ${SOLVIA_DATASOURCE_USERNAME:solvia}
    password: ${SOLVIA_DATASOURCE_PASSWORD:solvia-local}
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 3000
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
